name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: picks_test
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: picks_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U picks_test -d picks_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://picks_test:ci-only-password@localhost:5432/picks_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json
      - run: npm ci --prefix server
      - run: npm ci --prefix client
      - run: npm run typecheck --prefix server
      - run: npm test --prefix server
      - run: npm run lint --prefix client
      - run: npm run build --prefix client
