services:
  - type: web
    name: picks-club
    runtime: docker
    plan: 0.5c-512mb
    region: oregon
    numInstances: 1
    autoDeployTrigger: checksPass
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: picks-club-db
          property: connectionString
      - key: APP_ORIGIN
        sync: false
      - key: CFBD_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: TRUST_PROXY_HOPS
        value: 1
      - key: REGISTRATION_CODE
        generateValue: true
      - key: PILOT_ORGANIZER_EMAILS
        sync: false
      - key: PILOT_POOL_LIMIT
        value: 1
databases:
  - name: picks-club-db
    databaseName: picks_club
    user: picks_club
    region: oregon
    plan: 0.1c-256mb
    postgresMajorVersion: "17"
    diskSizeGB: 1
    ipAllowList: []
